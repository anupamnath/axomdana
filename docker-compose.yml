version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: axomdana-db-dev
    environment:
      POSTGRES_USER: axomdana_user
      POSTGRES_PASSWORD: axomdana_pass
      POSTGRES_DB: axomdana_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U axomdana_user -d axomdana_db']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: axomdana-backend-dev
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://axomdana_user:axomdana_pass@postgres:5432/axomdana_db
      JWT_SECRET: axom-dana-llc-dev-jwt-secret-2026-beharbari-guwahati
      JWT_EXPIRES_IN: 7d
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - '5000:5000'
    volumes:
      - uploads-dev:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "npm run migrate && npm run seed && npm start"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: axomdana-frontend-dev
    ports:
      - '3000:80'
    depends_on:
      - backend

volumes:
  pgdata-dev:
  uploads-dev:
